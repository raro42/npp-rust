name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            os: ubuntu-latest
            artifact_name: npp-rs-linux-x86_64
            bin: npp-rs
          - name: windows-x86_64
            os: windows-latest
            artifact_name: npp-rs-windows-x86_64
            bin: npp-rs.exe
          - name: macos-aarch64
            os: macos-latest
            artifact_name: npp-rs-macos-aarch64
            bin: npp-rs
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Linux GUI deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libxkbcommon-dev libssl-dev
      - name: Build release
        run: cargo build -p app --release
      - name: Stage binary (Unix)
        if: runner.os != 'Windows'
        run: |
          mkdir -p dist
          cp "target/release/${{ matrix.bin }}" "dist/${{ matrix.artifact_name }}"
          chmod +x "dist/${{ matrix.artifact_name }}"
      - name: Stage binary (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item "target/release/${{ matrix.bin }}" "dist/${{ matrix.artifact_name }}.exe"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: dist/*
          if-no-files-found: error

  publish:
    name: GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Pack assets
        run: |
          mkdir -p release-assets
          find artifacts -type f -print
          # Flatten artifact dirs into release-assets/
          find artifacts -type f -exec cp {} release-assets/ \;
          cd release-assets
          for f in *; do
            if [[ "$f" == *.exe ]]; then
              zip -9 "${f%.exe}.zip" "$f"
            else
              tar -czf "${f}.tar.gz" "$f"
            fi
          done
          ls -la
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          body_path: docs/changelog.md
          files: |
            release-assets/*.tar.gz
            release-assets/*.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
