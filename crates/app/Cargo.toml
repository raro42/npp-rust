[package]
name = "app"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Notepad++-inspired OS-agnostic text editor"
default-run = "npp-rs"
build = "build.rs"

[[bin]]
name = "npp-rs"
path = "src/main.rs"

[dependencies]
buffer = { path = "../buffer" }
doc = { path = "../doc" }
fs = { path = "../fs" }
highlight = { path = "../highlight" }
format = { path = "../format" }
plugins = { path = "../plugins" }
eframe = { version = "0.31", default-features = true, features = ["default_fonts", "glow"] }
egui = "0.31"
rfd = "0.15"
anyhow = { workspace = true }
serde_json = "1"
serde = { workspace = true }
